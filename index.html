</style><style id="juice-effects">.board-wrap{position:relative;isolation:isolate}.cell.pop .face{animation:fruitBurst .38s cubic-bezier(.15,.8,.25,1) forwards!important}@keyframes fruitBurst{0%{transform:scale(1);filter:brightness(1)}32%{transform:scale(1.38) rotate(-10deg);filter:brightness(1.65) drop-shadow(0 0 8px #fff)}65%{transform:scale(.85) rotate(12deg);opacity:1}100%{transform:scale(.05) rotate(38deg);opacity:0}}.cell.line-clear{animation:lineBlast .39s ease-out forwards!important}.cell.sun-blast{animation:lineBlast .44s ease-out forwards!important}.juice-particle{position:absolute;left:0;top:0;width:var(--sz);height:var(--sz);border-radius:50%;background:var(--color);box-shadow:0 0 7px var(--color);pointer-events:none;z-index:15;animation:juiceFly var(--dur) cubic-bezier(.16,.65,.35,1) forwards}@keyframes juiceFly{0%{transform:translate(var(--x),var(--y)) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(.15);opacity:0}}.juice-ring{position:absolute;left:0;top:0;border:3px solid #fff9a3;border-radius:50%;width:18px;height:18px;pointer-events:none;z-index:14;animation:juiceRing .43s ease-out forwards}@keyframes juiceRing{from{transform:translate(var(--x),var(--y)) scale(.3);opacity:1}to{transform:translate(var(--x),var(--y)) scale(3.3);opacity:0}}.board.juice-shake{animation:juiceShake .23s ease-out}@keyframes juiceShake{0%,100%{transform:translate(0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px)}}.cell.drop-in .face{animation:fruitDrop .33s cubic-bezier(.18,1.3,.42,1) both}@keyframes fruitDrop{from{transform:translateY(-45px) scale(.7);opacity:.35}70%{transform:translateY(4px) scale(1.12)}to{transform:translateY(0) scale(1);opacity:1}}.juice-score{position:absolute;z-index:17;font-size:18px;font-weight:1000;color:#fff;text-shadow:0 2px 0 #ff6399,0 3px 8px #752f65;pointer-events:none;animation:juiceScore .8s ease-out forwards}@keyframes juiceScore{from{transform:translate(-50%,0) scale(.5);opacity:0}25%{opacity:1;transform:translate(-50%,-15px) scale(1.25)}to{transform:translate(-50%,-55px) scale(1);opacity:0}}</style><style id="candy-motion">

</style></head><body><main class="game"><header class="top"><div class="subtitle">PA GAMING STUDIO</div><div class="title">🍓 FRUIT MATCH MANIA</div></header><section class="hud"><div class="stat"><small>LEVEL</small><strong id="level">1</strong></div><div class="stat"><small>MOVES</small><strong id="moves">25</strong></div><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>LIVES</small><strong id="lives">❤️❤️❤️</strong></div></section><div class="goal" id="goal">🎯 Reach 1,500 points to win!</div><div class="prog"><i id="bar"></i></div><div class="board-wrap"><div class="board" id="board" aria-label="Match three fruits"></div></div><div class="boosters"><button class="bst" id="bH">🔨</button><button class="bst" id="bS">🔀</button><button class="bst" id="bM">➕</button></div><div class="bottom"><button class="pill" id="restart">↻ Restart</button><div class="hint">4 = Line Clear ⚡ · 5 = Sun ☀️<br>Tap Sun, then any fruit!</div><div style="display:flex;gap:6px"><button class="pill" id="music" aria-label="Toggle music" style="padding:11px 14px">🎵</button><button class="pill" id="sound" aria-label="Toggle sound effects" style="padding:11px 14px">🔊</button></div></div><div class="overlay show" id="intro"><div class="modal"><div class="stars">🍓🍊🍇</div><h2>Fruit Match Mania</h2><p id="introTxt"></p><button class="primary" id="play">▶ TAP TO PLAY</button></div></div><div class="overlay" id="overlay"><div class="modal"><div class="stars" id="stars">⭐⭐⭐</div><h2 id="modalTitle">Level Complete!</h2><p id="modalText"></p><button class="primary" id="next">Next Level →</button></div></div></main><script>(()=>{'use strict';
const N=8,SUN=6,animals=['🍓','🍊','🍇','🍉','🍋','🍎','☀️'];
let grid=[],sp=[],jelly=[],goal={type:"score"},kinds=6,gen=0,hammer=false,bst={h:0,s:0,m:0},save={},selected=null,level=1,moves=25,score=0,busy=false,muted=false,startX=0,startY=0,pointerIndex=-1;
const board=document.getElementById('board'),overlay=document.getElementById('overlay');
const random=()=>Math.floor(Math.random()*kinds),idx=(r,c)=>r*N+c,ab=e=>{if(e!=='abort')throw e},sleep=ms=>{const g=gen;return new Promise((res,rej)=>setTimeout(()=>g===gen?res():rej('abort'),ms))};
function ld(){try{save=JSON.parse(localStorage.getItem('fmm')||'{}')}catch(e){save={}}}function sv(){try{localStorage.setItem('fmm',JSON.stringify(save))}catch(e){}}
function buzz(p){if(!muted&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
const jl=()=>jelly.reduce((a,b)=>a+(b>0?1:0),0);
function goalText(){return goal.type==='collect'?'🎯 Collect '+goal.need+' '+animals[goal.kind]+' ('+Math.min(goal.got,goal.need)+'/'+goal.need+')':goal.type==='jelly'?'🍬 Clear all jelly: '+jl()+' left':'🎯 Target: '+target().toLocaleString()+' points'}
function frac(){return Math.min(1,goal.type==='collect'?goal.got/goal.need:goal.type==='jelly'?1-jl()/goal.total:score/target())}
function done(){return frac()>=1}
function updScore(){updLives();document.getElementById('score').textContent=score.toLocaleString();document.getElementById('bar').style.width=frac()*100+'%';document.getElementById('goal').textContent=goalText()}
function updBoost(){const e=(id,t,n,on)=>{const b=document.getElementById(id);b.textContent=t+' ×'+n;b.disabled=!n;b.classList.toggle('on',!!on)};e('bH','🔨 Hammer',bst.h,hammer);e('bS','🔀 Shuffle',bst.s);e('bM','➕ 5 Moves',bst.m)}
const LMAX=3,LREG=600000,BC=['#ff5e84','#ffb33f','#9b68ff','#ff5969','#ffe05e','#74d960'];
function syncLives(){if(save.lives==null)save.lives=LMAX;if(save.lives<LMAX){const now=Date.now();if(!save.lt)save.lt=now;const n=Math.floor((now-save.lt)/LREG);if(n>0){save.lives=Math.min(LMAX,save.lives+n);save.lt=save.lives>=LMAX?0:save.lt+n*LREG;sv()}}else save.lt=0}
function nextIn(){return Math.max(0,Math.ceil((save.lt+LREG-Date.now())/1000))}
function updLives(){syncLives();document.getElementById('lives').textContent='❤️'.repeat(save.lives)+'🖤'.repeat(LMAX-save.lives)}
const mmss=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
function onClear(i){if(goal.type==='collect'&&grid[i]===goal.kind)goal.got++;if(jelly[i]>0)jelly[i]--}
function expand(arr){const set=new Set(arr),q=[...arr];while(q.length){const i=q.pop(),t=sp[i];if(!t)continue;const r=Math.floor(i/N),c=i%N;if(t===3){for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const rr=r+dr,cc=c+dc;if(Math.abs(dr)+Math.abs(dc)>2||rr<0||rr>=N||cc<0||cc>=N)continue;const j=idx(rr,cc);if(!set.has(j)){set.add(j);q.push(j)}}continue}for(let k=0;k<N;k++){const j=t===1?idx(r,k):idx(k,c);if(!set.has(j)){set.add(j);q.push(j)}}}return [...set]}
function target(){return 1100+(level-1)*450}
function render(){board.innerHTML='';grid.forEach((v,i)=>{const b=document.createElement('button');b.className='cell'+(selected===i?' selected':'')+(v===SUN?' sun':'')+(sp[i]===3?' bomb':sp[i]?' stripe'+sp[i]:'')+(jelly[i]?' jelly'+jelly[i]:'');b.dataset.i=i;if(sp[i]===3)b.style.setProperty('--bc',BC[v]||'#ff5e84');b.setAttribute('aria-label',v===SUN?'Sun power':animals[v]+' tile');b.innerHTML='<span class="face">'+(v===null?'':sp[i]===3?'💣':animals[v])+'</span>';b.addEventListener('click',()=>tap(i));b.addEventListener('pointerdown',e=>{clearHint();pointerIndex=i;startX=e.clientX;startY=e.clientY});b.addEventListener('pointerup',e=>{if(pointerIndex!==i)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))>18){let r=Math.floor(i/N),c=i%N;if(Math.abs(dx)>Math.abs(dy))c+=Math.sign(dx);else r+=Math.sign(dy);if(r>=0&&r<N&&c>=0&&c<N){selected=null;swapAttempt(i,idx(r,c))}}pointerIndex=-1});board.appendChild(b)});document.getElementById('level').textContent=level;document.getElementById('moves').textContent=moves;updScore();updBoost()}
function matchInfo(preferred=-1){const hit=new Set(),rows=new Set(),cols=new Set(),st=new Map(),hs=new Set(),vs=new Set(),fives=[];for(let r=0;r<N;r++){let c=0;while(c<N){let e=c+1;while(e<N&&grid[idx(r,e)]===grid[idx(r,c)])e++;if(grid[idx(r,c)]!==null&&grid[idx(r,c)]!==SUN&&e-c>=3){const run=Array.from({length:e-c},(_,k)=>idx(r,c+k));run.forEach(i=>{hit.add(i);hs.add(i)});if(run.length>=5)fives.push(run);else if(run.length===4)st.set(run.includes(preferred)?preferred:run[1],2)}c=e}}for(let c=0;c<N;c++){let r=0;while(r<N){let e=r+1;while(e<N&&grid[idx(e,c)]===grid[idx(r,c)])e++;if(grid[idx(r,c)]!==null&&grid[idx(r,c)]!==SUN&&e-r>=3){const run=Array.from({length:e-r},(_,k)=>idx(r+k,c));run.forEach(i=>{hit.add(i);vs.add(i)});if(run.length>=5)fives.push(run);else if(run.length===4)st.set(run.includes(preferred)?preferred:run[1],1)}r=e}}const suns=new Set();for(const run of fives){const at=run.includes(preferred)?preferred:run[Math.floor(run.length/2)];suns.add(at)}for(const i of suns)hit.delete(i);for(const i of hs)if(vs.has(i)&&!suns.has(i))st.set(i,3);for(const i of st.keys())hit.delete(i);for(const i of suns)st.delete(i);const arr=expand([...hit]);return {hit:arr,fired:arr.length>hit.size||[...hit].some(i=>sp[i]),rows,cols,suns,stripes:st}}
function matches(){const m=matchInfo();return m.hit.length>0||m.suns.size>0}
function possible(){if(grid.includes(SUN)||sp.some(x=>x))return true;for(let i=0;i<64;i++){const r=Math.floor(i/N),c=i%N;for(const j of [c<7?i+1:-1,r<7?i+8:-1]){if(j<0)continue;[grid[i],grid[j]]=[grid[j],grid[i]];const ok=matches();[grid[i],grid[j]]=[grid[j],grid[i]];if(ok)return true}}return false}
function makeBoard(){let attempts=0;do{grid=[];sp=new Array(64).fill(0);for(let r=0;r<N;r++)for(let c=0;c<N;c++){const choices=Array.from({length:kinds},(_,k)=>k).filter(v=>!(c>=2&&grid[idx(r,c-1)]===v&&grid[idx(r,c-2)]===v)&&!(r>=2&&grid[idx(r-1,c)]===v&&grid[idx(r-2,c)]===v));grid.push(choices[Math.floor(Math.random()*choices.length)])}}while(!possible()&&++attempts<100)}
function tap(i){if(busy)return;clearHint();if(hammer&&grid[i]!==null){hammer=false;bst.h--;blast([i],'🔨 SMASH!','line',true);return}if(selected===null){selected=i;sfx.tick();render();return}if(selected===i){selected=null;render();return}const a=selected;selected=null;if(grid[a]===SUN||grid[i]===SUN){activateSun(grid[a]===SUN?a:i,grid[a]===SUN?i:a);return}if(Math.abs(Math.floor(a/N)-Math.floor(i/N))+Math.abs(a%N-i%N)===1)swapAttempt(a,i);else{selected=i;render()}}
let hintTimer=null;
function clearHint(){clearTimeout(hintTimer);board.querySelectorAll('.hint-wiggle').forEach(e=>e.classList.remove('hint-wiggle'))}
function findHint(){for(let i=0;i<64;i++){const r=Math.floor(i/N),c=i%N;for(const j of [c<7?i+1:-1,r<7?i+8:-1]){if(j<0||grid[i]===SUN||grid[j]===SUN)continue;[grid[i],grid[j]]=[grid[j],grid[i]];const ok=matches();[grid[i],grid[j]]=[grid[j],grid[i]];if(ok)return [i,j]}}const s=grid.indexOf(SUN),q=sp.findIndex(x=>x);return s>=0?[s]:q>=0?[q]:null}
function scheduleHint(){clearTimeout(hintTimer);hintTimer=setTimeout(()=>{if(busy||overlay.classList.contains('show'))return;const h=findHint();if(h)h.forEach(i=>board.children[i]?.classList.add('hint-wiggle'))},5000)}
const AC=window.AudioContext||window.webkitAudioContext;
let ctx=null,sfxG=null,musG=null,noiseBuf=null,musicOn=true,musTimer=null,nextT=0,mstep=0;
const mf=m=>440*Math.pow(2,(m-69)/12),PENT=[0,2,4,7,9],pent=i=>12*Math.floor(i/5)+PENT[i%5];
function audio(){if(!ctx&&AC){try{ctx=new AC();sfxG=ctx.createGain();sfxG.gain.value=.9;musG=ctx.createGain();musG.gain.value=.55;const comp=ctx.createDynamicsCompressor();sfxG.connect(comp);musG.connect(comp);comp.connect(ctx.destination);noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.1,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ctx=null}}if(ctx&&ctx.state==='suspended')ctx.resume();return ctx}
function tone(f,dur,o={}){const c=audio();if(!c)return;const t=o.at??c.currentTime,osc=c.createOscillator(),g=c.createGain();osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);const v=o.vol??.12;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.atk||.008));g.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(g);g.connect(o.bus||sfxG);osc.start(t);osc.stop(t+dur+.05)}
function hat(t,vol){const c=audio();if(!c||!noiseBuf)return;const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=noiseBuf;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);src.connect(f);f.connect(g);g.connect(musG);src.start(t);src.stop(t+.06)}
const sfx={
 on:()=>!muted&&audio(),
 tick(){if(!this.on())return;tone(mf(84),.06,{type:'triangle',vol:.08})},
 swap(){if(!this.on())return;tone(mf(72),.14,{to:mf(81),vol:.1})},
 bad(){if(!this.on())return;tone(mf(53),.16,{type:'square',vol:.06,to:mf(47)});tone(mf(47),.2,{type:'square',vol:.06,to:mf(41),at:ctx.currentTime+.12})},
 match(combo,n){if(!this.on())return;const t=ctx.currentTime,base=(Math.min(combo,6)-1)*2;tone(220,.1,{to:80,vol:.13});for(let k=0;k<3;k++)tone(mf(Math.min(72+pent(base+k),100)),.18,{type:'triangle',vol:.13,at:t+k*.055});if(n>=5)tone(mf(Math.min(72+pent(base+4),104)),.25,{type:'sine',vol:.09,at:t+.17})},
 line(){if(!this.on())return;const t=ctx.currentTime;tone(300,.4,{to:1500,type:'sawtooth',vol:.05});for(let k=0;k<5;k++)tone(mf(84+PENT[k]),.2,{type:'triangle',vol:.09,at:t+.1+k*.05})},
 sunMade(){if(!this.on())return;const t=ctx.currentTime;[72,76,79,84,88,91].forEach((m,k)=>tone(mf(m),.3,{type:'triangle',vol:.1,at:t+k*.06}))},
 sun(){if(!this.on())return;const t=ctx.currentTime;[60,64,67,72].forEach(m=>tone(mf(m),.7,{vol:.09}));tone(200,.6,{to:1800,type:'sawtooth',vol:.045});for(let k=0;k<6;k++)tone(mf(96-PENT[k%5]),.18,{type:'triangle',vol:.07,at:t+.15+k*.06})},
 boom(){if(!this.on())return;tone(110,.5,{to:30,type:'sawtooth',vol:.15});tone(60,.45,{to:25,vol:.2})},
 land(){if(!this.on())return;tone(mf(48),.09,{to:mf(38),vol:.08})},
 win(){if(!this.on())return;duck(2600);const t=ctx.currentTime;[72,76,79,84].forEach((m,k)=>tone(mf(m),.3,{type:'triangle',vol:.12,at:t+k*.13}));[72,76,79,84].forEach(m=>tone(mf(m),.9,{vol:.08,at:t+.55}))},
 lose(){if(!this.on())return;duck(2200);const t=ctx.currentTime;[67,64,60,55].forEach((m,k)=>tone(mf(m),.4,{type:'triangle',vol:.11,at:t+k*.22}))}
};
function duck(ms){if(!musG)return;const t=ctx.currentTime;musG.gain.cancelScheduledValues(t);musG.gain.setTargetAtTime(.12,t,.08);setTimeout(()=>{if(musG)musG.gain.setTargetAtTime(.55,ctx.currentTime,.4)},ms)}
const CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],EIGHTH=60/118/2,ARP=[0,1,2,1,2,1,2,1];
function musicStep(s,t){const bar=Math.floor(s/8)%4,i=s%8,ch=CH[bar];
 if(i===0)tone(mf(ch[0]-12),.45,{at:t,vol:.14,bus:musG});
 if(i===4)tone(mf(ch[0]-5),.4,{at:t,vol:.1,bus:musG});
 if(i%4===0)tone(120,.12,{at:t,to:45,vol:.1,bus:musG});
 tone(mf(ch[ARP[i]]+12),.22,{at:t,type:'triangle',vol:.05,bus:musG});
 if([0,2,3,5,6].includes(i)&&Math.random()<.6)tone(mf(72+pent(Math.floor(Math.random()*7))),.3,{at:t,vol:.055,bus:musG});
 if(i%2===1)hat(t,.03)}
function musicTick(){if(!ctx||!musicOn||ctx.state!=='running')return;if(nextT<ctx.currentTime)nextT=ctx.currentTime+.05;while(nextT<ctx.currentTime+.4){musicStep(mstep,nextT);nextT+=EIGHTH;mstep++}}
function startMusic(){if(!audio()||musTimer)return;nextT=ctx.currentTime+.05;musTimer=setInterval(musicTick,120)}
function stopMusic(){clearInterval(musTimer);musTimer=null}
document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else ctx.resume()});
function toast(msg,big){const t=document.createElement('div');t.className='toast'+(big?' big':'');t.textContent=msg;document.querySelector('.game').appendChild(t);setTimeout(()=>t.remove(),big?1150:1050)}
function juicyBurst(indices,boost=false){const wrap=document.querySelector('.board-wrap'),rect=wrap.getBoundingClientRect();const colors=['#ff5e84','#ffb33f','#9b68ff','#ff5969','#ffe05e','#74d960'];const picks=indices.length>20?indices.filter((_,k)=>k%2===0):indices;for(const i of picks){const el=board.children[i];if(!el)continue;const b=el.getBoundingClientRect(),x=b.left-rect.left+b.width/2,y=b.top-rect.top+b.height/2;const color=colors[grid[i]]||'#fff45e';for(let k=0;k<(boost?7:5);k++){const a=Math.random()*Math.PI*2,dist=17+Math.random()*(boost?68:42),dot=document.createElement('i');dot.className='juice-particle';dot.style.setProperty('--x',x+'px');dot.style.setProperty('--y',y+'px');dot.style.setProperty('--dx',Math.cos(a)*dist+'px');dot.style.setProperty('--dy',Math.sin(a)*dist+22+'px');dot.style.setProperty('--sz',(3+Math.random()*6)+'px');dot.style.setProperty('--color',k%3===0?'#fff':color);dot.style.setProperty('--dur',(350+Math.random()*300)+'ms');wrap.appendChild(dot);setTimeout(()=>dot.remove(),700)}if(boost||Math.random()<.4){const ring=document.createElement('i');ring.className='juice-ring';ring.style.setProperty('--x',(x-9)+'px');ring.style.setProperty('--y',(y-9)+'px');wrap.appendChild(ring);setTimeout(()=>ring.remove(),480)}}if(indices.length>=4){board.classList.remove('juice-shake');void board.offsetWidth;board.classList.add('juice-shake');setTimeout(()=>board.classList.remove('juice-shake'),260)}const scoreText=document.createElement('div');scoreText.className='juice-score';scoreText.textContent='+'+(indices.length*50)+(boost?' ✨':'');const mid=board.children[indices[Math.floor(indices.length/2)]]?.getBoundingClientRect();if(mid){scoreText.style.left=(mid.left-rect.left+mid.width/2)+'px';scoreText.style.top=(mid.top-rect.top)+'px';wrap.appendChild(scoreText);setTimeout(()=>scoreText.remove(),850)}}
function animateFalls(dist,rowStagger){const first=board.children[0];if(!first)return 0;const step=first.getBoundingClientRect().height+3;let maxT=0;for(let i=0;i<board.children.length;i++){const d=dist[i];if(!d)continue;const face=board.children[i].firstChild;if(!face)continue;const r=Math.floor(i/N),c=i%N;const dur=Math.min(620,260+d*65);const delay=c*22+(rowStagger?(N-1-r)*45:0);face.style.position='relative';face.style.zIndex='5';const y=-d*step;face.animate([{transform:'translateY('+y+'px) scale(1,1)',easing:'cubic-bezier(.55,0,.9,.6)'},{transform:'translateY(0) scale(1.1,.82)',offset:.68,easing:'ease-out'},{transform:'translateY(-7px) scale(.96,1.06)',offset:.84,easing:'ease-in'},{transform:'translateY(0) scale(1,1)'}],{duration:dur,delay:delay,fill:'backwards'});maxT=Math.max(maxT,dur+delay)}return maxT}
async function fall(){const dist=new Array(N*N).fill(0);for(let c=0;c<N;c++){const vals=[];for(let r=N-1;r>=0;r--)if(grid[idx(r,c)]!==null)vals.push({v:grid[idx(r,c)],from:r,s:sp[idx(r,c)]});const nNew=N-vals.length;while(vals.length<N)vals.push({v:random(),from:null,s:0});for(let r=N-1,k=0;r>=0;r--,k++){const t=vals[k];grid[idx(r,c)]=t.v;sp[idx(r,c)]=t.s;dist[idx(r,c)]=t.from===null?nNew:r-t.from}}render();const t=animateFalls(dist,false);setTimeout(()=>sfx.land(),Math.max(t*.62,150));await sleep(Math.max(t,120)+30)}
function blast(c,m,k,f){return _blast(c,m,k,f).catch(ab)}
async function _blast(cl,msg,snd,free){busy=true;selected=null;hammer=false;if(!free)moves--;cl=expand(cl);render();juicyBurst(cl,true);cl.forEach(i=>board.children[i]?.classList.add('sun-blast'));toast(msg);sfx[snd]();if(cl.some(i=>sp[i]===3))sfx.boom();buzz([30,40,60]);score+=cl.length*75;updScore();await sleep(330);cl.forEach(i=>{onClear(i);grid[i]=null;sp[i]=0});await fall();await resolve();endMove()}
function activateSun(sun,animal){if(busy||moves<=0)return;clearHint();const kind=grid[animal],cl=[];if(kind===SUN){for(let i=0;i<64;i++)cl.push(i);return blast(cl,'☀️☀️ MEGA BLAST!','sun')}for(let i=0;i<64;i++)if(grid[i]===kind||i===sun)cl.push(i);if(sp[animal]){const ty=sp[animal];cl.forEach(i=>{if(!sp[i])sp[i]=ty===3?3:1+(i%2)});return blast(cl,'☀️⚡ STRIPE STORM!','sun')}return blast(cl,'☀️ SUN POWER! '+animals[kind]+' CLEAR!','sun')}
function slideTiles(a,b,back){const ea=board.children[a],eb=board.children[b];if(!ea||!eb)return Promise.resolve();const ra=ea.getBoundingClientRect(),rb=eb.getBoundingClientRect();const dx=rb.left-ra.left,dy=rb.top-ra.top;const mk=(el,x,y)=>{const f=el.firstChild;f.style.position='relative';f.style.zIndex='6';const from='translate(0,0)',to='translate('+x+'px,'+y+'px)';const kf=back?[{transform:to},{transform:from}]:[{transform:from},{transform:to}];return f.animate(kf,{duration:back?260:170,easing:back?'cubic-bezier(.3,1.7,.5,1)':'ease-in-out',fill:'both'}).finished.catch(()=>{})};return Promise.all([mk(ea,dx,dy),mk(eb,-dx,-dy)])}
function swapAttempt(a,b){return _swap(a,b).catch(ab)}
async function _swap(a,b){if(busy||moves<=0)return;if(grid[a]===SUN||grid[b]===SUN)return activateSun(grid[a]===SUN?a:b,grid[a]===SUN?b:a);const g=gen;clearHint();sfx.swap();busy=true;board.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));await slideTiles(a,b,false);if(g!==gen)return;const sw=()=>{[grid[a],grid[b]]=[grid[b],grid[a]];[sp[a],sp[b]]=[sp[b],sp[a]]};sw();if(sp[a]||sp[b]){const A=sp[a],B=sp[b],r=Math.floor(b/N),c=b%N;let cl=[],m='⚡ STRIPE BLAST!',k='line';if(A&&B){if(A===3&&B===3){m='💣💣 MEGA BOMB!';for(let i=0;i<64;i++)if(Math.abs(Math.floor(i/N)-r)<=2&&Math.abs(i%N-c)<=2)cl.push(i)}else if(A===3||B===3){m='💣⚡ BIG CROSS!';for(let i=0;i<64;i++)if(Math.abs(Math.floor(i/N)-r)<=1||Math.abs(i%N-c)<=1)cl.push(i)}else{sp[a]=1;sp[b]=2;cl=[a,b];m='⚡⚡ CROSS BLAST!'}}else{cl=[A?a:b];if((A||B)===3)m='💣 BOMB BLAST!'}return blast(cl,m,k)}if(!matches()){sw();sfx.bad();buzz(40);await slideTiles(a,b,true);if(g!==gen)return;render();busy=false;scheduleHint();return}render();moves--;await resolve(b);endMove()}
function endMove(){if(done()){finish(true);return}if(moves===0){finish(false);return}if(!possible()){doShuffle();return}render();busy=false;scheduleHint()}
function doShuffle(){busy=true;const g=gen;let t=0;const it=grid.map((v,i)=>({v,s:sp[i]}));do{for(let i=63;i>0;i--){const j=Math.floor(Math.random()*(i+1));[it[i],it[j]]=[it[j],it[i]]}grid=it.map(x=>x.v);sp=it.map(x=>x.s)}while((matches()||!possible())&&++t<60);selected=null;render();const d=animateFalls(new Array(64).fill(2),true);sfx.sunMade();toast('🔀 SHUFFLE!');setTimeout(()=>{if(g===gen){busy=false;scheduleHint()}},d+30)}
async function resolve(preferred=-1){let combo=0;while(true){const info=matchInfo(preferred);preferred=-1;const found=info.hit;if(!found.length&&!info.suns.size&&!info.stripes.size)break;combo++;juicyBurst(found,info.fired);found.forEach(i=>board.children[i]?.classList.add('pop'));if(info.suns.size){toast('☀️ SUN CREATED!');sfx.sunMade()}else if(info.stripes.size){toast([...info.stripes.values()].includes(3)?'💣 BOMB FRUIT!':'⚡ STRIPED FRUIT!');sfx.sunMade()}else if(info.fired){toast('⚡ STRIPE BLAST!');sfx.line()}sfx.match(combo,found.length);if(found.some(i=>sp[i]===3))sfx.boom();buzz(info.fired?[20,30,40]:combo>1?[15,25,15]:12);score+=found.length*50*combo+(info.fired?200*combo:0)+info.suns.size*250+info.stripes.size*150;updScore();await sleep(390);for(const i of found){onClear(i);grid[i]=null;sp[i]=0}for(const i of info.suns){grid[i]=SUN;sp[i]=0}for(const [i,t] of info.stripes)sp[i]=t;await fall()}if(combo>1)toast(['','','Sweet! 🍬','Tasty! 😋','Delicious! 🤩','Divine! 🌈'][Math.min(combo,5)]+' '+combo+'× combo',true)}
function finish(win){busy=true;win?sfx.win():sfx.lose();save.best=Math.max(save.best||0,score);if(win){save.level=level+1;buzz([60,40,60,40,150])}sv();overlay.classList.add('show');document.getElementById('stars').textContent=win?(moves>=12?'⭐⭐⭐':moves>=5?'⭐⭐':'⭐'):'🐾';document.getElementById('modalTitle').textContent=win?'Level Complete!':'Out of Moves!';document.getElementById('modalText').textContent=win?'Amazing! You scored '+score.toLocaleString()+' points.':'You scored '+score.toLocaleString()+'. Try again!';document.getElementById('next').textContent=win?'Next Level →':'Try Again ↻';document.getElementById('next').onclick=()=>{if(win)level++;start()};document.getElementById('next').disabled=false;if(!win)lifeLost()}
function start(){gen++;const g=gen,L=level,ty=['score','collect','jelly','score'][(L-1)%4];kinds=L<3?5:6;score=0;moves=Math.max(16,26-Math.floor((L-1)/3))+(ty==='jelly'?4:0);selected=null;hammer=false;bst={h:2,s:2,m:1};busy=true;overlay.classList.remove('show');makeBoard();goal={type:ty};jelly=new Array(64).fill(0);if(ty==='collect'){goal.kind=Math.floor(Math.random()*kinds);goal.need=12+3*Math.ceil(L/4);goal.got=0}if(ty==='jelly'){const n=Math.min(30,12+2*Math.ceil(L/4));[...Array(64).keys()].sort(()=>Math.random()-.5).slice(0,n).forEach(i=>jelly[i]=L>8&&Math.random()<.4?2:1);goal.total=n}render();const t=animateFalls(new Array(N*N).fill(N),true);setTimeout(()=>{if(g===gen&&!overlay.classList.contains('show')){busy=false;scheduleHint()}},t+30)}
const $=id=>document.getElementById(id);let introTk=null;

['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{audio();if(musicOn&&!$('intro').classList.contains('show'))startMusic()},{once:true}));
ld();level=save.level||1;muted=!!save.muted;musicOn=save.music!==false;$('sound').textContent=muted?'🔇':'🔊';$('music').style.opacity=musicOn?1:.45;
busy=true;makeBoard();render();showIntro();


name: Generate Fruit Match Mania Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore upload-keystore.jks \
            -alias fruitmatchkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=PA Gaming Studio, OU=Games, O=PA Gaming Studio, L=Ambala, ST=Haryana, C=IN"

      - name: Convert to Base64
        run: |
          base64 -w 0 upload-keystore.jks > keystore-base64.txt

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Fruit-Match-Keystore
          path: |
            upload-keystore.jks
            keystore-base64.txt
          retention-days: 1
